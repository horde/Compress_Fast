---
id: Compress_Fast
name: Compress_Fast
full: Fast compression library
description: >-
  A libary that provides compression suitable for packing strings on-the-fly in
  PHP code (as opposed to more resource-intensive compression algorithms such as
  DEFLATE).
list: dev
type: library
authors:
  - name: Michael Slusarz
    user: slusarz
    email: slusarz@horde.org
    active: false
    role: lead
version:
  release: 2.0.0
  api: 2.0.0alpha1
state:
  release: stable
  api: alpha
license:
  identifier: LGPL-2.1-only
  uri: http://www.horde.org/licenses/lgpl21
dependencies:
  required:
    php: ^8
    composer:
      horde/exception: ^3
  optional:
    ext:
      zlib: '*'
      lzf: '*'
      horde_lz4: '*'
  dev:
    composer:
      horde/test: ^3
vendor: horde
keywords: null
ci-platform:
  '8.0':
    - php: ^7.4 || ^8
    - ext-dom
  '8.1':
    - php: ^7.4 || ^8
    - ext-dom
  '8.2':
    - php: ^7.4 || ^8
    - ext-dom
  '8.3':
    - php: ^7.4 || ^8
    - ext-dom
  '8.4':
    - php: ^7.4 || ^8
    - ext-dom
  '8.5':
    - php: ^7.4 || ^8
    - ext-dom
  '8.6':
    - php: ^7.4 || ^8
    - ext-dom
ci-platform-flags:
  needs_installer_plugin: false
